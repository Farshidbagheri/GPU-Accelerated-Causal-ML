name: Longitudinal causal benchmark (synthetic CPU)
on:
  workflow_dispatch:
  push:
    paths:
      - src/longitudinal_synthetic_benchmark.py
      - tests/test_causal_benchmark.py
      - .github/workflows/causal-benchmark.yml
permissions:
  contents: read
jobs:
  synthetic-models:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific CPU dependencies
        run: |
          python -m pip install "numpy>=1.26,<3" "scikit-learn>=1.4,<2" "pytest>=8,<10"
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Test assumptions and implementation
        run: python -m pytest -q tests/test_causal_benchmark.py
      - name: Run three independent patient-level holdout benchmarks
        run: python src/longitudinal_synthetic_benchmark.py --seeds 40,41,42 --patients 1200 --epochs 45 --out results/causal_benchmark.json
      - name: Upload synthetic aggregate benchmark
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-causal-benchmark
          path: results/causal_benchmark.json
          retention-days: 14
